<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediaFlex Studio PRO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <link rel="manifest" href="/manifest.json">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
    
    .gradient-brand {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #06b6d4 100%);
    }
    .gradient-button {
      background: linear-gradient(90deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
    }
    
    .glow-orb-1 {
      background: radial-gradient(circle, rgba(168,85,247,0.22) 0%, rgba(0,0,0,0) 70%);
    }
    .glow-orb-2 {
      background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, rgba(0,0,0,0) 70%);
    }

    .glass-card {
      background: rgba(15, 17, 26, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-[#07080d] text-zinc-100 min-h-screen flex flex-col justify-between antialiased relative overflow-x-hidden">

  <div class="fixed top-[-10%] left-[-10%] w-[80vw] sm:w-[50vw] h-[80vw] sm:h-[50vw] glow-orb-1 pointer-events-none -z-10"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[80vw] sm:w-[50vw] h-[80vw] sm:h-[50vw] glow-orb-2 pointer-events-none -z-10"></div>

  <header class="border-b border-white/5 bg-[#07080d]/80 backdrop-blur-xl shrink-0 z-50 sticky top-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
      
      <a href="#" class="flex items-center gap-3">
        <div class="relative w-9 h-9 rounded-xl gradient-brand p-[1px] shadow-[0_0_20px_rgba(168,85,247,0.4)]">
          <div class="w-full h-full bg-[#0a0c14] rounded-[11px] flex items-center justify-center">
            <svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z" fill="currentColor" fill-opacity="0.2"/>
            </svg>
          </div>
        </div>
        <span class="text-base font-bold tracking-tight text-white">MediaFlex</span>
      </a>

      <div class="flex items-center gap-2">
        <button id="downloadAppBtn" class="px-4 py-1.5 rounded-full bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-xs font-bold text-white shadow-md hover:shadow-lg transition-all flex items-center gap-1.5 active:scale-95 border border-white/20">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          <span>App</span>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-6 py-6 flex flex-col justify-center relative z-10">

    <div class="flex justify-center mb-6 shrink-0">
      <div class="p-1 rounded-full bg-white/5 border border-white/10 flex space-x-1 backdrop-blur-xl shadow-2xl w-full sm:w-auto max-w-md">
        <button id="tab-img" onclick="switchTab('img')" class="flex-1 sm:flex-none px-6 py-2.5 rounded-full text-xs sm:text-sm font-bold transition-all duration-300 gradient-button text-white active:scale-95">Image</button>
        <button id="tab-audio" onclick="switchTab('audio')" class="flex-1 sm:flex-none px-6 py-2.5 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 text-zinc-400 hover:text-white active:scale-95">Audio</button>
      </div>
    </div>

    <!-- TOOL 1: IMAGE TOOL -->
    <section id="tool-img" class="glass-card rounded-2xl sm:rounded-3xl p-5 sm:p-7 shadow-2xl relative overflow-hidden shrink-0 border border-white/10">
      
      <div id="img-dropzone" onclick="document.getElementById('img-input').click()" class="border-2 border-dashed border-white/15 hover:border-purple-500/60 rounded-xl sm:rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 bg-white/[0.02] hover:bg-white/[0.05] active:scale-[0.99] group">
        <input type="file" id="img-input" accept="image/*,.heic,.heif" class="hidden" onchange="handleImageSelect(event)">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-500/20 to-cyan-500/20 border border-white/15 flex items-center justify-center mx-auto text-cyan-400 group-hover:scale-110 transition-transform duration-300 shadow-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        </div>
      </div>

      <div id="heic-loader" class="hidden my-4 text-center p-4 bg-purple-500/10 border border-purple-500/20 rounded-xl">
        <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-purple-500 border-t-transparent"></div>
      </div>

      <div id="img-controls" class="hidden mt-4 space-y-4">
        <div class="flex flex-row gap-3 items-center justify-between bg-black/40 border border-white/10 p-3.5 rounded-xl">
          <div class="flex items-center space-x-3 overflow-hidden">
            <img id="img-preview" class="w-14 h-14 object-cover rounded-lg border border-white/10 shrink-0" src="" alt="">
            <div class="min-w-0">
              <p id="img-name" class="font-semibold text-xs sm:text-sm text-white truncate"></p>
              <p id="img-size" class="text-[10px] sm:text-xs text-cyan-400 font-mono mt-0.5"></p>
              <p id="img-dims" class="text-[10px] sm:text-xs text-zinc-400 font-mono mt-0.5"></p>
            </div>
          </div>
          <button onclick="resetImageTool()" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-zinc-300 hover:text-white text-xs font-semibold transition-all shrink-0 border border-white/10">✕</button>
        </div>

        <div class="bg-black/30 border border-white/5 p-3.5 rounded-xl">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <input type="number" id="img-width" placeholder="Width (px)" class="w-full bg-black/60 border border-white/10 rounded-lg p-2.5 text-xs focus:border-purple-500 outline-none text-white font-mono">
            </div>
            <div>
              <input type="number" id="img-height" placeholder="Height (px)" class="w-full bg-black/60 border border-white/10 rounded-lg p-2.5 text-xs focus:border-purple-500 outline-none text-white font-mono">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <select id="img-format" class="w-full bg-black/60 border border-white/10 rounded-lg p-2.5 text-xs focus:border-purple-500 outline-none text-white font-medium">
              <option value="image/jpeg">JPG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp">WEBP</option>
            </select>
          </div>

          <div>
            <div class="flex space-x-2">
              <input type="number" id="target-size" placeholder="Target Size" class="w-full bg-black/60 border border-white/10 rounded-lg p-2.5 text-xs focus:border-purple-500 outline-none text-white font-mono" min="0.1" step="any">
              <select id="target-unit" class="bg-black/60 border border-white/10 rounded-lg p-2.5 text-xs focus:border-purple-500 outline-none text-white font-bold shrink-0">
                <option value="KB">KB</option>
                <option value="MB">MB</option>
              </select>
            </div>
          </div>
        </div>

        <button onclick="processImage()" class="w-full gradient-button text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-[0.99] text-xs sm:text-sm">Process →</button>
      </div>
    </section>

    <!-- TOOL 2: AUDIO EXTRACTOR -->
    <section id="tool-audio" class="hidden glass-card rounded-2xl sm:rounded-3xl p-5 sm:p-7 shadow-2xl relative overflow-hidden shrink-0 border border-white/10">
      
      <div id="video-dropzone" onclick="document.getElementById('video-input').click()" class="border-2 border-dashed border-white/15 hover:border-cyan-500/60 rounded-xl sm:rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 bg-white/[0.02] hover:bg-white/[0.05] active:scale-[0.99] group">
        <input type="file" id="video-input" accept="video/*" class="hidden" onchange="handleVideoSelect(event)">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-500/20 border border-white/15 flex items-center justify-center mx-auto text-cyan-400 group-hover:scale-110 transition-transform duration-300 shadow-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </div>
      </div>

      <div id="video-controls" class="hidden mt-4 space-y-4">
        <div class="bg-black/40 border border-white/10 p-3.5 rounded-xl flex items-center justify-between gap-2 overflow-hidden">
          <div class="min-w-0">
            <p id="video-name" class="font-semibold text-xs sm:text-sm text-white truncate"></p>
            <p id="video-size" class="text-[10px] sm:text-xs text-zinc-400 font-mono mt-0.5"></p>
          </div>
          <button onclick="resetVideoTool()" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-zinc-300 hover:text-white text-xs font-semibold transition-all shrink-0 border border-white/10">✕</button>
        </div>

        <button onclick="extractAudio()" class="w-full gradient-button text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-[0.99] text-xs sm:text-sm">Extract Audio →</button>
      </div>
    </section>

  </main>

  <footer class="border-t border-white/5 py-3 px-6 bg-[#07080d]/80 backdrop-blur-xl shrink-0 mt-auto text-center text-xs text-zinc-500">
    MediaFlex Studio
  </footer>

  <script>
    let deferredPrompt;
    const downloadBtn = document.getElementById('downloadAppBtn');

    function isAppInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    if (isAppInstalled()) {
      if (downloadBtn) downloadBtn.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isAppInstalled() && downloadBtn) {
        downloadBtn.style.display = 'inline-flex';
      }
    });

    if (downloadBtn) {
      downloadBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            downloadBtn.style.display = 'none';
          }
          deferredPrompt = null;
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      if (downloadBtn) downloadBtn.style.display = 'none';
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.log(err));
      });
    }

    function switchTab(tab) {
      document.getElementById('tool-img').classList.toggle('hidden', tab !== 'img');
      document.getElementById('tool-audio').classList.toggle('hidden', tab !== 'audio');
      
      const activeBtn = 'flex-1 sm:flex-none px-6 py-2.5 rounded-full text-xs sm:text-sm font-bold transition-all duration-300 gradient-button text-white active:scale-95';
      const inactiveBtn = 'flex-1 sm:flex-none px-6 py-2.5 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 text-zinc-400 hover:text-white active:scale-95';

      document.getElementById('tab-img').className = tab === 'img' ? activeBtn : inactiveBtn;
      document.getElementById('tab-audio').className = tab === 'audio' ? activeBtn : inactiveBtn;
    }

    let loadedImage = null;

    function resetImageTool() {
      loadedImage = null;
      document.getElementById('img-input').value = '';
      document.getElementById('img-preview').src = '';
      document.getElementById('img-controls').classList.add('hidden');
      document.getElementById('heic-loader').classList.add('hidden');
      document.getElementById('img-dropzone').classList.remove('hidden');
    }

    async function handleImageSelect(e) {
      let file = e.target.files[0];
      if (!file) return;

      const fileExt = file.name.split('.').pop().toLowerCase();

      if (fileExt === 'heic' || fileExt === 'heif') {
        document.getElementById('img-dropzone').classList.add('hidden');
        document.getElementById('heic-loader').classList.remove('hidden');

        try {
          const convertedBlob = await heic2any({
            blob: file,
            toType: 'image/jpeg',
            quality: 0.9
          });
          
          const blobToProcess = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
          file = new File([blobToProcess], file.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
        } catch (err) {
          alert('Error loading HEIC file');
          resetImageTool();
          return;
        } finally {
          document.getElementById('heic-loader').classList.add('hidden');
        }
      }

      document.getElementById('img-name').innerText = file.name;
      const sizeFormatted = file.size > 1024 * 1024 
        ? (file.size / (1024 * 1024)).toFixed(2) + ' MB' 
        : (file.size / 1024).toFixed(1) + ' KB';
        
      document.getElementById('img-size').innerText = sizeFormatted;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          loadedImage = img;
          document.getElementById('img-preview').src = evt.target.result;
          document.getElementById('img-dims').innerText = `${img.width}x${img.height} px`;
          
          document.getElementById('img-width').value = img.width;
          document.getElementById('img-height').value = img.height;

          document.getElementById('img-controls').classList.remove('hidden');
          document.getElementById('img-dropzone').classList.add('hidden');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function processImage() {
      if (!loadedImage) return;

      const format = document.getElementById('img-format').value;
      const rawSize = parseFloat(document.getElementById('target-size').value);
      const unit = document.getElementById('target-unit').value;
      const ext = format.split('/')[1].replace('jpeg', 'jpg');

      let customWidth = parseInt(document.getElementById('img-width').value) || loadedImage.width;
      let customHeight = parseInt(document.getElementById('img-height').value) || loadedImage.height;

      let canvas = document.createElement('canvas');
      canvas.width = customWidth;
      canvas.height = customHeight;
      let ctx = canvas.getContext('2d');
      ctx.drawImage(loadedImage, 0, 0, customWidth, customHeight);

      if (!rawSize || rawSize <= 0) {
        canvas.toBlob((blob) => {
          triggerBlobDownload(blob, `resized-${customWidth}x${customHeight}.${ext}`);
        }, format, 0.9);
        return;
      }

      let targetBytes = Math.round(unit === 'MB' ? rawSize * 1024 * 1024 : rawSize * 1024);

      let quality = 0.95;
      let initialBlob = await canvasToBlob(canvas, format, quality);

      if (initialBlob.size > targetBytes) {
        let scaleFactor = 1.0;
        let currentBlob = initialBlob;

        for (let attempt = 0; attempt < 25; attempt++) {
          canvas = document.createElement('canvas');
          const w = Math.max(Math.floor(customWidth * scaleFactor), 50);
          const h = Math.max(Math.floor(customHeight * scaleFactor), 50);
          canvas.width = w;
          canvas.height = h;

          ctx = canvas.getContext('2d');
          ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

          currentBlob = await canvasToBlob(canvas, format, quality);

          if (currentBlob.size <= targetBytes) break;

          if (quality > 0.15) {
            quality -= 0.04;
          } else {
            scaleFactor *= 0.92;
          }
        }
        triggerBlobDownload(currentBlob, `resized-${customWidth}x${customHeight}-${rawSize}${unit}.${ext}`);
      } 
      else {
        let bytesNeeded = targetBytes - initialBlob.size;
        if (bytesNeeded > 0) {
          const imageBuffer = await initialBlob.arrayBuffer();
          const paddingBuffer = new Uint8Array(bytesNeeded);
          
          const finalBlob = new Blob([imageBuffer, paddingBuffer], { type: format });
          triggerBlobDownload(finalBlob, `resized-${customWidth}x${customHeight}-${rawSize}${unit}.${ext}`);
        } else {
          triggerBlobDownload(initialBlob, `resized-${customWidth}x${customHeight}-${rawSize}${unit}.${ext}`);
        }
      }
    }

    function canvasToBlob(canvas, format, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), format, quality);
      });
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.download = filename;
      downloadLink.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    let selectedVideo = null;

    function resetVideoTool() {
      selectedVideo = null;
      document.getElementById('video-input').value = '';
      document.getElementById('video-controls').classList.add('hidden');
      document.getElementById('video-dropzone').classList.remove('hidden');
    }

    function handleVideoSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedVideo = file;
      document.getElementById('video-name').innerText = file.name;
      document.getElementById('video-size').innerText = (file.size / (1024*1024)).toFixed(1) + ' MB';
      
      document.getElementById('video-controls').classList.remove('hidden');
      document.getElementById('video-dropzone').classList.add('hidden');
    }

    async function extractAudio() {
      if (!selectedVideo) return;
      
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await selectedVideo.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      const offlineCtx = new OfflineAudioContext(audioBuffer.numberOfChannels, audioBuffer.length, audioBuffer.sampleRate);
      const source = offlineCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(offlineCtx.destination);
      source.start();

      const renderedBuffer = await offlineCtx.startRendering();
      const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);

      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `audio.wav`;
      a.click();
    }

    function bufferToWave(abuffer, len) {
      let numOfChan = abuffer.numberOfChannels,
          length = len * numOfChan * 2 + 44,
          buffer = new ArrayBuffer(length),
          view = new DataView(buffer),
          channels = [], i, sample, offset = 0, pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
      setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

      for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

      while (pos < length) {
        for (i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          view.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
      }
      return new Blob([buffer], { type: "audio/wav" });
    }
  </script>
</body>
</html>
